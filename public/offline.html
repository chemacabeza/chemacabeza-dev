<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#020817" />
        <meta name="color-scheme" content="dark" />
        <meta name="robots" content="noindex" />
        <title>You are offline — chemacabeza.dev</title>
        <style>
            * { box-sizing: border-box; }
            body {
                margin: 0;
                min-height: 100svh;
                display: grid;
                place-items: center;
                padding: 24px;
                background: #020817;
                color: #f1f5f9;
                font-family: system-ui, sans-serif;
                line-height: 1.6;
            }
            main { width: 100%; max-width: 440px; }
            .brand { color: #a5b4fc; font-size: 16px; font-weight: 700; }
            h1 { margin: 24px 0 12px; font-size: 36px; line-height: 1.2; }
            p { margin: 0 0 24px; color: #cbd5e1; font-size: 18px; }
            button {
                min-height: 48px;
                padding: 12px 24px;
                border: 0;
                border-radius: 10px;
                background: #4f46e5;
                color: white;
                font: inherit;
                font-weight: 600;
                cursor: pointer;
            }
            button:hover { background: #4338ca; }
            button:focus-visible, a:focus-visible {
                outline: 3px solid #c7d2fe;
                outline-offset: 4px;
            }
            a { color: #a5b4fc; }
            .home { display: block; width: fit-content; margin-top: 24px; }
        </style>
    </head>
    <body>
        <main>
            <p class="brand">chemacabeza.dev</p>
            <h1>You are offline</h1>
            <p>Connect to Wi-Fi or mobile data, then try again.</p>
            <button id="retry" type="button">Try again</button>
            <a class="home" href="/">Back to homepage</a>
            <noscript><p>Use your browser&apos;s reload button to try again.</p></noscript>
        </main>
        <script>
            document.getElementById("retry").addEventListener("click", function () {
                window.location.reload();
            });
        </script>
    </body>
</html>
